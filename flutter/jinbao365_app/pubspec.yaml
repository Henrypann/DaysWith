name: jinbao365
description: "DaysWith — 记录成长，收藏美好. One Flutter app for Android and iOS."
publish_to: 'none'
version: 3.0.0+11

environment:
  sdk: ^3.13.7

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  exif: ^3.3.0
  fc_native_video_thumbnail: ^4.0.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  jinbao_core:
    path: ../jinbao_core
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand_mark.png
